# Параметры поиска — их читает ежедневная задача
region:
  timezone: GMT+7
  city: "" # не важен — ищем по всей РФ, учитывать стоимость перегона/доставки
  radius_km: 0
budget:
  min_rub: 600000
  max_rub: 700000
  reserve_rub: 40000 # диагностика, ОСАГО, первое ТО
filters:
  transmission: [automatic] # классический АКПП; вариатор — только Toyota/Honda, робот — нет
  body: [sedan, hatchback, wagon]
  max_owners: 4
  max_mileage_km: 220000
  year_from: 2008
  right_hand_drive: ok # подтверждено: праворульные японцы наравне с левым рулём
  exclude:
    - такси / каршеринг
    - ДТП с повреждением силовых элементов
    - залог / ограничения ГИБДД
sources:
  # Объявления. Если источник недоступен (429, капча, таймаут) — пропускаем и пишем в «Статус источников», сводка не падает.
  listings:
    - name: Дром
      url: https://auto.drom.ru
      how: WebFetch/curl, до ~40 запросов за запуск
      notes: бесплатная часть отчёта по VIN, владельцы по ПТС, оценка цены
    - name: Авито
      url: https://www.avito.ru/all/avtomobili
      how: "npm run avito → data/avito/YYYY-MM-DD.json (браузер Playwright, мягко падает на 429)"
      notes: больше всего объявлений; часто режет по IP
    - name: Авто.ру
      url: https://auto.ru/rossiya/cars/used/
      how: WebFetch, до ~20 запросов
      notes: отчёт ПроАвто (превью), владельцы, ПТС
    - name: СберАвто
      url: https://sberauto.com/cars
      how: WebFetch
      notes: дилеры и частники, проверка истории
    - name: Автотека Маркет / дилеры с пробегом
      url: https://autoteka.ru
      how: WebSearch
      notes: только с полной ценой и VIN на сайте; кредитные автосалоны без цены — 🚩
  market:
    - https://www.autostat.ru
    - https://www.autonews.ru
    - https://www.zr.ru
    - https://www.kolesa.ru
